<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ex.06 BMI Calculator</title>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
      background: #1e293b;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    header h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 0.3rem;
    }

    header p {
      color: #94a3b8;
      font-size: 1rem;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .calculator-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .btn {
      flex: 1;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-calculate {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .btn-calculate:hover {
      background-color: #0ea5e9;
    }

    .btn-reset {
      background-color: #475569;
      color: #f8fafc;
    }

    .btn-reset:hover {
      background-color: #64748b;
    }

    .error-msg {
      color: #f87171;
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }

    .result-section {
      margin-top: 2rem;
      padding: 1.25rem;
      border-radius: 12px;
      text-align: center;
      background: #0f172a;
      border: 1px solid #334155;
    }

    .result-section h3 {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    .bmi-value {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .bmi-category {
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* Category Colors */
    .underweight { color: #facc15; }
    .normal { color: #4ade80; }
    .overweight { color: #fb923c; }
    .obese { color: #f87171; }

    footer {
      background-color: #1e293b;
      border-top: 1px solid #334155;
      text-align: center;
      padding: 1.25rem;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    footer strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [weight, setWeight] = useState('');
      const [height, setHeight] = useState('');
      const [bmi, setBmi] = useState(null);
      const [category, setCategory] = useState('');
      const [categoryClass, setCategoryClass] = useState('');
      const [error, setError] = useState('');

      const calculateBMI = (e) => {
        e.preventDefault();
        setError('');

        const w = parseFloat(weight);
        const h = parseFloat(height);

        if (!w || !h || w <= 0 || h <= 0) {
          setError('Please enter valid positive values for both weight and height.');
          setBmi(null);
          setCategory('');
          return;
        }

        // Convert height from cm to meters: height in meters = h / 100
        const heightInMeters = h / 100;
        const bmiValue = (w / (heightInMeters * heightInMeters)).toFixed(1);
        setBmi(bmiValue);

        // Classify BMI
        if (bmiValue < 18.5) {
          setCategory('Underweight');
          setCategoryClass('underweight');
        } else if (bmiValue >= 18.5 && bmiValue < 24.9) {
          setCategory('Normal Weight');
          setCategoryClass('normal');
        } else if (bmiValue >= 25 && bmiValue < 29.9) {
          setCategory('Overweight');
          setCategoryClass('overweight');
        } else {
          setCategory('Obese');
          setCategoryClass('obese');
        }
      };

      const resetFields = () => {
        setWeight('');
        setHeight('');
        setBmi(null);
        setCategory('');
        setError('');
      };

      return (
        <div className="app-wrapper">
          <header>
            <h1>MediFit Health Portal</h1>
            <p>Smart Body Mass Index (BMI) Analytics</p>
          </header>

          <main>
            <div className="calculator-card">
              <form onSubmit={calculateBMI}>
                <div className="input-group">
                  <label htmlFor="weight">Weight (kg)</label>
                  <input
                    id="weight"
                    type="number"
                    step="any"
                    placeholder="e.g., 70"
                    value={weight}
                    onChange={(e) => setWeight(e.target.value)}
                  />
                </div>

                <div className="input-group">
                  <label htmlFor="height">Height (cm)</label>
                  <input
                    id="height"
                    type="number"
                    step="any"
                    placeholder="e.g., 175"
                    value={height}
                    onChange={(e) => setHeight(e.target.value)}
                  />
                </div>

                <div className="btn-group">
                  <button type="submit" className="btn btn-calculate">Calculate BMI</button>
                  <button type="button" className="btn btn-reset" onClick={resetFields}>Reset</button>
                </div>
              </form>

              {error && <p className="error-msg">{error}</p>}

              {bmi && (
                <div className="result-section">
                  <h3>Your Calculated BMI</h3>
                  <div className={`bmi-value ${categoryClass}`}>{bmi}</div>
                  <div className={`bmi-category ${categoryClass}`}>{category}</div>
                </div>
              )}
            </div>
          </main>

          <footer>
            <p>Developed by: <strong>Lokesh K</strong> | Register No: <strong>[Enter Your Register Number]</strong></p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
